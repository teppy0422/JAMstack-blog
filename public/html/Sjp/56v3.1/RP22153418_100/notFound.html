<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>notFound</title>
	<style>
		@keyframes backgroundAnimation {
			0% {
				background-position: 0 0;
			}
			100% {
				background-position: 100% 100%;
			}
		}
		body {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			font-family: Arial, sans-serif;
			background-color: #EDE4FA;
			background-image: radial-gradient(circle, #C6AEE0 3.5px, transparent 4px);
			background-size: 28px 28px;
			animation: backgroundAnimation 100s linear infinite;
			color: #333;
		}
		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}
		.character {
			margin-bottom: 20px;
			position: relative;
		}
		.balloon2-left {
			position: relative;
			display: inline-block;
			margin: 1.5em 0 1.5em 15px;
			padding: 20px 10px;
			min-width: 120px;
			max-width: 100%;
			color: #555;
			font-size: 16px;
			background: #FFF;
			border: solid 1px #555;
			box-sizing: border-box;
			border-radius: 13px;
		}
		.balloon2-left:before {
			content: "";
			position: absolute;
			top: 100%;
			left: 50%;
			transform: translateX(-50%);
			border: 12px solid transparent;
			border-top: 12px solid #FFF;
			z-index: 2;
		}
		.balloon2-left:after {
			content: "";
			position: absolute;
			top: 100%;
			left: 50%;
			transform: translateX(-50%);
			border: 14px solid transparent;
			border-top: 14px solid #555;
			z-index: 1;
		}
		.balloon2-left p {
			margin: 0;
			padding: 0;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="balloon2-left">
			<div id="notFoundMessage">存在しない端末/構成番号です</div>
			<div>元のページに戻ります</div>
		</div>
		<div class="character">
			<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
				<text x="78" y="20" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFF" stroke="#3B2A28" stroke-width="2" paint-order="stroke" text-anchor="middle">?</text>
				<g transform="rotate(-9 48 54)">
					<ellipse cx="30" cy="80" rx="4.5" ry="7" fill="#3B2A28"/>
					<ellipse cx="48" cy="83" rx="4.5" ry="7" fill="#3B2A28"/>
					<ellipse cx="66" cy="80" rx="4.5" ry="7" fill="#3B2A28"/>
					<ellipse cx="48" cy="54" rx="30" ry="27" fill="#F1685C" stroke="#3B2A28" stroke-width="3"/>
					<line x1="48" y1="30" x2="48" y2="80" stroke="#3B2A28" stroke-width="2.4"/>
					<circle cx="29" cy="47" r="5" fill="#3B2A28"/>
					<circle cx="33" cy="66" r="4.2" fill="#3B2A28"/>
					<circle cx="64" cy="45" r="4.6" fill="#3B2A28"/>
					<circle cx="61" cy="67" r="5" fill="#3B2A28"/>
					<path d="M38 16c-4-4-9-5-9-5" stroke="#3B2A28" stroke-width="2.6" stroke-linecap="round" fill="none"/>
					<circle cx="28.5" cy="10.2" r="2.6" fill="#3B2A28"/>
					<path d="M57 14c4-2 9 0 9 0" stroke="#3B2A28" stroke-width="2.6" stroke-linecap="round" fill="none"/>
					<circle cx="67.5" cy="13.2" r="2.6" fill="#3B2A28"/>
					<circle cx="48" cy="27" r="16" fill="#3B2A28"/>
					<ellipse cx="37" cy="32.5" rx="4.6" ry="3" fill="#FFA6B0" opacity="0.9"/>
					<ellipse cx="59" cy="32.5" rx="4.6" ry="3" fill="#FFA6B0" opacity="0.9"/>
					<circle cx="40" cy="26" r="6.6" fill="#FFF"/>
					<circle cx="54" cy="26" r="6.6" fill="#FFF"/>
					<circle cx="38.6" cy="24.6" r="3.5" fill="#2B2320"/>
					<circle cx="52.6" cy="24.6" r="3.5" fill="#2B2320"/>
					<circle cx="40.1" cy="22.9" r="1.2" fill="#FFF"/>
					<circle cx="54.1" cy="22.9" r="1.2" fill="#FFF"/>
					<ellipse cx="46" cy="36" rx="3.4" ry="2.6" fill="#2B2320"/>
				</g>
			</svg>
		</div>
	</div>
	<script>
		if (new URLSearchParams(location.search).get('reason') === 'wiring') {
			document.getElementById('notFoundMessage').textContent = '56_配索誘導が作成されていません';
		}
		setTimeout(function() {
			var referrer = document.referrer;
			if (referrer) {
				window.location.href = referrer;
			} else {
				window.location.href = "index.html";
			}
		}, 2000);
	</script>
</body>
</html>
