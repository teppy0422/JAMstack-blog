<script>
// サブ番号のタイルを押したら、そのサブの先頭の構成番号.html へ。ヘッダーの高さだけ中身を下げる
document.querySelectorAll('.sub').forEach(function (el) { el.addEventListener('click', function () { navigateOrNotFound(el.getAttribute('data-composition') + '.html'); }); });
// 構成番号・端末番号のページから来た時(index.html?from=サブ番号)は、そのサブのタイルの枠の色を変えて、見える所までスクロールする
(function () { var m = location.search.match(/[?&]from=([^&]*)/); if (!m) return; var from = decodeURIComponent(m[1]); document.querySelectorAll('.sub').forEach(function (el) { if (el.getAttribute('data-sub') === from) { el.classList.add('from'); el.scrollIntoView({ block: 'center' }); } }); })();
document.querySelector('main').style.paddingTop = document.querySelector('header').offsetHeight + 'px';
// 背景の星空。星の数は画面の広さで決め、1 つずつ 3～8 秒でゆっくりまたたく。動きを減らす設定の時は止めた絵にする
(function () {
    var cv = document.getElementById('starSky'), cx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), W, H, stars = [];
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function resize() { W = window.innerWidth; H = window.innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); stars = []; for (var i = 0; i < Math.round(W * H / 4500); i++) stars.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(0.4, 1.3), ph: rnd(0, 6.28), per: rnd(3, 8) }); }
    function frame(t) { cx.clearRect(0, 0, W, H); cx.fillStyle = '#dfe8ff'; stars.forEach(function (s) { cx.globalAlpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t / 1000 / s.per * 6.28 + s.ph)); cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.28); cx.fill(); }); cx.globalAlpha = 1; if (!reduce) requestAnimationFrame(frame); }
    window.addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
})();
</script>
