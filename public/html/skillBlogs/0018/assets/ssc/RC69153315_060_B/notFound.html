<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>notFound</title>
	<style>
		@keyframes backgroundAnimation {
			0% {
				background-position: 0 0;
			}
			100% {
				background-position: 100% 100%;
			}
		}
		body {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #111 25%, #000 25%, #000 50%, #111 50%, #111 75%, #000 75%, #000 100%);
			background-size: 56.57px 56.57px;
			animation: backgroundAnimation 100s linear infinite;
			color: #333;
		}
		.container {
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}
		.character {
			margin-bottom: 20px; /* キャラクターと吹き出しの間にスペースを追加 */
		}
		.balloon2-left {
			position: relative;
			display: inline-block;
			margin: 1.5em 0 1.5em 15px;
			padding: 20px 10px;
			min-width: 120px;
			max-width: 100%;
			color: #555;
			font-size: 16px;
			background: #FFF;
			border: solid 1px #555;
			box-sizing: border-box;
			border-radius: 13px;
		}
		.balloon2-left:before {
			content: "";
			position: absolute;
			top: 100%;
			left: 50%;
			transform: translateX(-50%);
			border: 12px solid transparent;
			border-top: 12px solid #FFF;
			z-index: 2;
		}
		.balloon2-left:after {
			content: "";
			position: absolute;
			top: 100%;
			left: 50%;
			transform: translateX(-50%);
			border: 14px solid transparent;
			border-top: 14px solid #555;
			z-index: 1;
		}
		.balloon2-left p {
			margin: 0;
			padding: 0;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="balloon2-left">
			<div id="notFoundMessage">存在しない端末/構成ナンバーです</div>
			<div>元のページに戻ります</div>
		</div>
		<div class="character">
			<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M48 8C29.6 8 15 22.6 15 41v39.5c0 2.9 3.4 4.5 5.6 2.6l6.9-5.9 6.9 5.9c1.7 1.5 4.3 1.5 6 0l6.6-5.7 6.6 5.7c1.7 1.5 4.3 1.5 6 0l6.9-5.9 6.9 5.9c2.2 1.9 5.6.3 5.6-2.6V41C81 22.6 66.4 8 48 8z" fill="#FFF" stroke="#555" stroke-width="3" stroke-linejoin="round"/>
				<circle cx="36" cy="42" r="4.5" fill="#555"/>
				<circle cx="60" cy="42" r="4.5" fill="#555"/>
				<path d="M38 56c3 3 7 4.5 10 4.5s7-1.5 10-4.5" stroke="#555" stroke-width="3" stroke-linecap="round" fill="none"/>
			</svg>
		</div>
	</div>
	<script>
		if (new URLSearchParams(location.search).get('reason') === 'wiring') {
			document.getElementById('notFoundMessage').textContent = '56_配索誘導が作成されていません';
		}
		setTimeout(function() {
			var referrer = document.referrer;
			if (referrer) {
				window.location.href = referrer;
			} else {
				window.location.href = "index.html"; // リファラーがない場合のフォールバック
			}
		}, 2000);
	</script>
</body>
</html>
